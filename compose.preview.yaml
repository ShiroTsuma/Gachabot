name: gachabot-preview

services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:18791:8791"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8791
      Dashboard__AllowAnonymousInDevelopment: "true"
      Discord__Enabled: "false"
      Workers__Enabled: "false"
      BrowserAutomation__ChromiumSandbox: "false"
      DatabaseStorage__ConnectionString: Host=postgres;Database=gachabot;Username=preview;Password=local-preview-only
      S3Media__Endpoint: http://storage:9000
      S3Media__Region: us-east-1
      S3Media__AccessKey: preview-user
      S3Media__SecretKey: local-preview-only
      S3Media__Bucket: gachabot-media
      S3Media__ForcePathStyle: "true"
    volumes:
      - dashboard-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gachabot
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: local-preview-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preview -d gachabot"]
      interval: 3s
      timeout: 3s
      retries: 30

  storage:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: preview-user
      MINIO_ROOT_PASSWORD: local-preview-only
    volumes:
      - storage-data:/data

  storage-init:
    image: quay.io/minio/mc:latest
    environment:
      MC_HOST_preview: http://preview-user:local-preview-only@storage:9000
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        attempt=0
        until mc ready preview; do
          attempt=$$((attempt + 1))
          [ "$$attempt" -lt 60 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing preview/gachabot-media
    depends_on:
      - storage

volumes:
  dashboard-data:
  postgres-data:
  storage-data:
