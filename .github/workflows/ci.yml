name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore GachaBot.slnx --configfile NuGet.Config --locked-mode
      - name: Build
        run: dotnet build GachaBot.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test GachaBot.slnx --configuration Release --no-build --no-restore
      - name: Docker build
        run: docker build --tag gachabot:ci .
