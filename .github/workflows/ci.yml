name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore GachaBot.slnx --configfile NuGet.Config --locked-mode
      - name: Build
        run: dotnet build GachaBot.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test GachaBot.slnx --configuration Release --no-build --no-restore
      - name: Docker build
        run: docker build --tag gachabot:ci .
      - name: Start isolated dashboard preview
        run: |
          docker compose -f compose.preview.yaml up --build -d
          curl --fail --retry 45 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:18791/health
          curl --fail http://127.0.0.1:18791/ --output /tmp/gachabot-preview.html
          test -s /tmp/gachabot-preview.html
      - name: Preview diagnostics
        if: failure()
        run: docker compose -f compose.preview.yaml logs --no-color
      - name: Stop preview
        if: always()
        run: docker compose -f compose.preview.yaml down --volumes
